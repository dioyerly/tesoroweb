{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto;">
    <a href="{{ url_for('panel_superadmin') }}" style="color: var(--neon-cyan); text-decoration: none;">← Volver al Panel</a>

    <div class="card" style="padding: 2rem; margin-top: 1rem;">
        <h2>✏️ Editar Empresa: {{ empresa.nombre }}</h2>

        <form method="POST" style="margin-top: 1.5rem;">
            <div style="margin-bottom: 1.5rem;">
                <label style="color: var(--neon-cyan); display: block; margin-bottom: 0.5rem;">Nombre/Razón Social:</label>
                <input type="text" name="nombre" value="{{ empresa.nombre }}" required
                    style="width: 100%; padding: 10px; background: #0b132b; color: white; border: 1px solid var(--border-color); border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="color: var(--neon-cyan); display: block; margin-bottom: 0.5rem;">CUIT:</label>
                <input type="text" name="cuit" value="{{ empresa.cuit }}" required
                    style="width: 100%; padding: 10px; background: #0b132b; color: white; border: 1px solid var(--border-color); border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="color: var(--neon-cyan); display: block; margin-bottom: 0.5rem;">Estado de Suscripción:</label>
                <select name="estado"
                    style="width: 100%; padding: 10px; background: #0b132b; color: white; border: 1px solid var(--border-color); border-radius: 4px; box-sizing: border-box;">
                    <option value="activa" {% if empresa.estado_suscripcion == 'activa' %}selected{% endif %}>ACTIVA</option>
                    <option value="suspendida" {% if empresa.estado_suscripcion == 'suspendida' %}selected{% endif %}>SUSPENDIDA</option>
                    <option value="cancelada" {% if empresa.estado_suscripcion == 'cancelada' %}selected{% endif %}>CANCELADA</option>
                </select>
            </div>

            <button type="submit" class="btn-neon" style="width: 100%; padding: 12px; background: #00b4d8; color: black; font-weight: bold; border: none; border-radius: 4px; cursor: pointer;">
                💾 Guardar Cambios
            </button>
        </form>
    </div>
</div>
{% endblock %}
