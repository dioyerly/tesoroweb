<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso a la Plataforma</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-principal);">
    <div class="card" style="width: 100%; max-width: 400px; padding: 2rem;">
        <div style="text-align: center; margin-bottom: 2rem; display: flex; justify-content: center;">
            <img src="{{ url_for('static', filename='img/tesoroweb-logo.png') }}" alt="TesoroWeb" style="height: 220px; width: auto; max-width: 100%;">
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div style="color: #ff4d4d; font-size: 0.85rem; margin-bottom: 1rem; text-align: center;">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <label style="color: var(--text-muted); font-size: 0.85rem;">Correo Electrónico:</label>
            <input type="email" name="email" required placeholder="tu@empresa.com" style="width: 100%; padding: 10px; margin-bottom: 1rem; background: #0b132b; color: white; border: 1px solid var(--border-color); border-radius: 4px;">

            <label style="color: var(--text-muted); font-size: 0.85rem;">Contraseña:</label>
            <input type="password" name="password" required placeholder="••••••••" style="width: 100%; padding: 10px; margin-bottom: 1.5rem; background: #0b132b; color: white; border: 1px solid var(--border-color); border-radius: 4px;">

            <button type="submit" class="btn-neon" style="width: 100%; padding: 10px;">Ingresar al Sistema</button>
        </form>
    </div>
</body>
</html>
